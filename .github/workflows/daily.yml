name: Ежедневный сбор тендеров

on:
  schedule:
    # 06:00 UTC = 09:00 по Израилю летом
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Прогон без отправки в Telegram"
        type: boolean
        default: false

concurrency:
  group: landtender-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: pip install -e .

      - name: Восстановить базу с прошлого запуска
        uses: actions/cache@v4
        with:
          path: data
          # v2 — база пересоздана: сменился формат ключа участка и включён
          # отбор только действующих тендеров. Старый кеш подхватывать нельзя,
          # иначе в сводку попадут записи со старыми идентификаторами.
          key: landtender-db-v2-${{ github.run_id }}
          restore-keys: landtender-db-v2-

      - name: Собрать конфиг
        run: cp landtender.example.toml landtender.toml

      - name: Проверить, что секреты заданы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=""
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing"
            echo "Добавьте их: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Секреты на месте."

      - name: Запуск
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Контекст inputs пуст при запуске по расписанию — приводим к флагу в shell
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          flags=""
          [ "$DRY_RUN" = "true" ] && flags="--dry-run"
          landtender run $flags --export-csv "data/new-$(date +%F).csv"

      - name: Сохранить выгрузку как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landtender-${{ github.run_id }}
          path: data/*.csv
          if-no-files-found: ignore
          retention-days: 30
