# Конфигурация landtender.
# Скопируйте в landtender.toml и правьте под себя.
# Секреты пишите как "env:ИМЯ_ПЕРЕМЕННОЙ" — значение возьмётся из окружения.

[general]
# Порог в долларах. Используется только для деления выдачи на группы,
# лоты дешевле порога никуда не пропадают.
threshold_usd = 1_000_000
# false — не делить выдачу по цене вообще: одна секция, дорогие сверху.
# Цены при этом остаются в каждой строке.
split_by_threshold = false
# Отбрасывать лоты, у которых срок подачи уже прошёл или тендер закрыт.
# false — показывать в том числе завершённые (полезно для анализа цен сделок).
hide_expired = true
# Города, которые интересуют. Пустой список [] — без ограничения по городам.
# Можно писать на иврите, по-русски или по-английски: "Иерусалим" = "ירושלים".
settlements = []
# Глубина просмотра в днях для источников, поддерживающих фильтр по дате.
lookback_days = 30
db_path = "data/landtender.sqlite3"
user_agent = "landtender/0.1 (+https://github.com/vadimsheinberg-beep/usreal)"
request_timeout = 45
# Пауза между запросами, секунды. Ниже 0.5 израильские порталы отдают 429.
rate_limit_delay = 1.0

[fx]
# boi — официальный представительный курс Банка Израиля; static — курс из конфига.
provider = "boi"
static_usd_ils = 3.70
cache_hours = 12

[valuation]
# Что считать «стоимостью земли», по убыванию приоритета:
# final — цена сделки, min — минимальная цена, appraisal — шумá, asking — запрос продавца.
price_preference = ["final", "min", "appraisal", "asking"]
# Прибавлять ли расходы на развитие (הוצאות פיתוח) к стоимости земли.
include_development_costs = false
# Держать ли в базе лоты без цены (их нельзя отнести ни к одной группе).
keep_priceless = true
# Считать ли оценку по сделкам с соседними участками (регрессия, см.
# valuation.py). Требует накопленной базы: landtender harvest забирает
# архив закрытых торгов рм"и, где лежат цены состоявшихся сделок.
estimate = true

# ---------------------------- дополнение лотов ------------------------------

[enrichment]
# Дотягивать по каждому лоту кадастр govmap и планы iplan.
# Выключено по умолчанию: это два-три чужих запроса на лот.
#
# Что даёт:
#   * настоящую площадь участка, когда тендер её не сообщил или сообщил
#     бессмыслицу (у тендера 21/2020 портал отдал «1 м²» сельхозполя);
#   * назначение земли по действующему плану;
#   * смену назначения — план, переводящий участок под застройку, и его
#     стадию. Для сельхозземли это главный ценообразующий факт.
enabled = true
# Сколько лотов дополнять за запуск.
budget = 40
# true — тратить бюджет только на сельхозземлю.
only_agricultural = false

# ------------------------------- источники ---------------------------------

[sources.rmi_michrazim]
# Управление земель Израиля — основной государственный реестр земельных тендеров.
enabled = true
# Сколько тендеров за запуск догружать деталями (там лежат цены участков,
# площади и назначение — без деталей лот остаётся без цены).
details_budget = 500
# Города для этого источника. Портал отдаёт город числовым кодом, поэтому
# отбор идёт по коду ЦСБ ещё до загрузки деталей — лимит не тратится впустую.
# Пустой список [] — все города страны.
settlements = []
# true — запрашивать у портала только действующие тендеры.
# При false портал отдаёт весь архив (более 10 000 тендеров за многие годы),
# лимита details_budget не хватает, и большинство лотов остаётся без цены.
active_only = true

[sources.urban_renewal]
# Управление городского обновления: объявленные комплексы פינוי בינוי и
# תמ"א 38 — застроенные участки со старыми домами, а не пустая земля.
# Цены у таких записей обычно нет: это реестр площадок, а не торги.
enabled = true
max_rows = 2000
queries = ["התחדשות עירונית", "פינוי בינוי", "מתחמי התחדשות עירונית"]

[sources.data_gov_il]
# Портал открытых данных правительства.
enabled = true
max_rows = 2000
queries = ["מכרזי מקרקעין", "מכרזים רשות מקרקעי ישראל", "עסקאות מקרקעין"]

[sources.gov_mr]
# Портал государственных закупок (мr.gov.il). Вспомогательный: цена есть не всегда.
enabled = true
max_pages = 5
keywords = ["מקרקעין", "מגרש"]

[sources.yad2]
# Частная площадка объявлений. 39 — категория «מגרשים» (участки).
enabled = true
max_pages = 5
property_types = [39]
# Если площадка потребует сессию — положите сюда куки: cookie = "env:YAD2_COOKIE"

# ------------------------------ уведомления --------------------------------

[telegram]
enabled = true
# Значения берутся из окружения или из файла .env рядом с конфигом.
# Проверить подключение: landtender telegram-test
bot_token = "env:TELEGRAM_BOT_TOKEN"
chat_id = "env:TELEGRAM_CHAT_ID"
# false — присылать только лоты дороже порога.
send_standard_tier = true
# Без деления по цене секция одна, поэтому лимит выше; полный список в CSV.
max_lots_per_tier = 60
notify_changes = true
# Прикладывать к сводке CSV со всеми новыми лотами отдельным файлом.
attach_csv = true
